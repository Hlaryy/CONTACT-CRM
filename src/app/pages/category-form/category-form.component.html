<div class="form-container">
  <h2>Nouvelle Catégorie</h2>

  <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Nom de la catégorie *</label>
      <input id="name" type="text" formControlName="name" placeholder="Ex: Partenaires">
      @if (categoryForm.get('name')?.invalid && categoryForm.get('name')?.touched) {
        <span class="error-text">Le nom est obligatoire (2 caractères minimum).</span>
      }
    </div>

    <div class="form-group">
      <label for="color">Couleur associée *</label>
      <input id="color" type="color" formControlName="color">
    </div>

    <div class="form-actions">
      <a routerLink="/categories" class="btn-cancel">Annuler</a>
      <button type="submit" [disabled]="categoryForm.invalid" class="btn-submit">Enregistrer</button>
    </div>
  </form>
</div>
